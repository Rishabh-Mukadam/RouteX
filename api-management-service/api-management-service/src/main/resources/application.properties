spring.application.name=api-management-service
server.port=8081

info.service.name=Api management service
info.service.description= Manages the configurations of apis and microservices

spring.datasource.url=jdbc:mysql://localhost:3306/routex_management
spring.datasource.username=root
spring.datasource.password=pass123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

security.jwt.expiration-seconds=3600

security.jwt.secret=gatekeeper-demo-jwt-secret-key-change-before-production